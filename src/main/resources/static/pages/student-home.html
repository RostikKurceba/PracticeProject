<!DOCTYPE html>
<html lang="uk">
<head>

    <meta charset="UTF-8">

    <title>Головна студент</title>

    <link rel="stylesheet" href="../css/student.css">

</head>

<body>

<div class="top-bar">

    <div class="left-panel">
        <button class="logout-btn" onclick="logout()">Вихід</button>
    </div>

    <div class="center-panel">

        <div class="week-nav">

            <button id="prevWeek" onclick="changeWeek(-1)">◀</button>

            <span id="weekLabel"></span>

            <button id="nextWeek" onclick="changeWeek(1)">▶</button>

        </div>

    </div>

    <div class="right-panel">
        <div id="userLabel"></div>
    </div>

</div>

<!-- пошук -->
<div id="searchContainer" class="student-search"></div>

<!-- результати -->
<div id="searchResult"></div>

<!-- календар -->
<div class="table-wrapper">
    <table id="calendar"></table>
</div>

<script src="../js/api.js"></script>
<script src="../js/home.js"></script>
<script src="../js/student.js"></script>

</body>
</html>
